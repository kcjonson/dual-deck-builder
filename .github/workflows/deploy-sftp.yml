name: Deploy to SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Web
      run: npm run build:web
    
    - name: Deploy to SFTP
      run: |
        # Install sshpass for password authentication
        sudo apt-get update && sudo apt-get install -y sshpass rsync
        
        # Deploy with rsync over SSH, creating directories as needed
        sshpass -p "${{ secrets.SFTP_PASSWORD }}" rsync -avz --mkpath -e "ssh -o StrictHostKeyChecking=no" \
          dist/web/ \
          ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:/bearcavinteractive.com/playtest/dual-deckbuilder/