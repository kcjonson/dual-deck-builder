name: Deploy to SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Web
      run: npm run build:web
    
    - name: Deploy over SSH
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y lftp

        echo "Deploying..."
        timeout 300 lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" \
          -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; \
              mirror -R --delete --verbose dist/web/ bearcavinteractive.com/playtest/dual-deckbuilder/; quit" \
          "sftp://$SFTP_SERVER"