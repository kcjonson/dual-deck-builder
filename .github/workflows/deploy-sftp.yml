name: Deploy to SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Web
      run: npm run build:web
    
    - name: Deploy over SSH
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass rsync

        echo "Testing SSH connection..."
        timeout 30 sshpass -p "$SFTP_PASSWORD" ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$SFTP_USERNAME@$SFTP_SERVER" "echo 'SSH connection successful'"

        echo "Deploying..."
        timeout 300 sshpass -p "$SFTP_PASSWORD" rsync -az --delete --mkpath \
          -e "ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
          dist/web/ \
          "$SFTP_USERNAME@$SFTP_SERVER:bearcavinteractive.com/playtest/dual-deckbuilder/"