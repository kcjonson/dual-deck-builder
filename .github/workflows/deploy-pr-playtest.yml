name: Deploy PR Playtest

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'playtest')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Web
      run: npm run build:web
    
    - name: Deploy over SSH
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SSH_HOST_KEYS: ${{ secrets.SSH_HOST_KEYS }}
        BRANCH_NAME: ${{ github.head_ref }}
      run: |
        case "$BRANCH_NAME" in
          *..*|/*|"") echo "Refusing suspicious branch name"; exit 1;;
        esac

        sudo apt-get update && sudo apt-get install -y lftp

        # Pin the server's host keys; an imposter host fails instead of connecting
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        while read -r type key; do
          [ -n "$type" ] && echo "$SFTP_SERVER $type $key"
        done <<< "$SSH_HOST_KEYS" >> ~/.ssh/known_hosts

        echo "Deploying..."
        # Credentials via env and stdin only; nothing secret in argv
        timeout 300 lftp <<EOF
        set net:timeout 20
        set net:max-retries 2
        open -u "$SFTP_USERNAME" --env-password "sftp://$SFTP_SERVER"
        mirror -R --delete --verbose dist/web/ "bearcavinteractive.com/playtest/dual-deckbuilder/$BRANCH_NAME/"
        quit
        EOF
    
    - name: Comment PR with playtest URL
      uses: actions/github-script@v6
      with:
        script: |
          const branch = context.payload.pull_request.head.ref;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🎮 **Playtest deployment ready!**\n\nTest this branch at: https://bearcavinteractive.com/playtest/dual-deckbuilder/${branch}/`
          })