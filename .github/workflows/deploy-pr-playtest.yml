name: Deploy PR Playtest

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'playtest')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build Web
      run: npm run build:web
    
    - name: Deploy over SSH
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        BRANCH_NAME: ${{ github.head_ref }}
      run: |
        case "$BRANCH_NAME" in
          *..*|/*|"") echo "Refusing suspicious branch name"; exit 1;;
        esac

        sudo apt-get update && sudo apt-get install -y sshpass rsync

        echo "Testing SSH connection..."
        timeout 30 sshpass -p "$SFTP_PASSWORD" ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$SFTP_USERNAME@$SFTP_SERVER" "echo 'SSH connection successful'"

        echo "Deploying..."
        timeout 300 sshpass -p "$SFTP_PASSWORD" rsync -az --delete --mkpath \
          -e "ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
          dist/web/ \
          "$SFTP_USERNAME@$SFTP_SERVER:bearcavinteractive.com/playtest/dual-deckbuilder/$BRANCH_NAME/"
    
    - name: Comment PR with playtest URL
      uses: actions/github-script@v6
      with:
        script: |
          const branch = context.payload.pull_request.head.ref;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🎮 **Playtest deployment ready!**\n\nTest this branch at: https://bearcavinteractive.com/playtest/dual-deckbuilder/${branch}/`
          })