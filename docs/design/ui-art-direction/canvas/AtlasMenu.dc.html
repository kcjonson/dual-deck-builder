<filter id="amGrime" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="29" result="big"></feTurbulence>
<feColorMatrix in="big" type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.28  0 0 0 0 0.13  1.4 0 0 0 -0.62" result="stain"></feColorMatrix>
<feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="47" result="mid"></feTurbulence>

<feMerge><feMergeNode in="mottle"></feMergeNode><feMergeNode in="stain"></feMergeNode></feMerge>
</filter>
<filter id="amBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"></feGaussianBlur></filter>
<mask id="amEdge" maskUnits="userSpaceOnUse" x="0" y="0" width="1412" height="872">

<rect x="60" y="60" width="1292" height="752" fill="#000" filter="url(#amBlur)"></rect>

<filter id="amRelief" x="0" y="0" width="640" height="780" filterUnits="userSpaceOnUse">

<feDiffuseLighting in="noise" surfaceScale="11" diffuseConstant="1" lighting-color="#ffffff" result="light"><feDistantLight azimuth="300" elevation="38"></feDistantLight></feDiffuseLighting>
<feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1.5" k2="0" k3="0" k4="0"></feComposite>
</filter>
<filter id="amSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"></feGaussianBlur></filter>
<pattern id="amHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#B5643C" stroke-width="1.4" opacity="0.5"></line></pattern>
<linearGradient id="amFold" x1="0" x2="1"><stop offset="0" stop-color="#3A2A14" stop-opacity="0"></stop><stop offset="0.46" stop-color="#3A2A14" stop-opacity="0.12"></stop><stop offset="0.5" stop-color="#FFF6DC" stop-opacity="0.45"></stop><stop offset="0.56" stop-color="#3A2A14" stop-opacity="0.06"></stop><stop offset="1" stop-color="#3A2A14" stop-opacity="0"></stop></linearGradient>
