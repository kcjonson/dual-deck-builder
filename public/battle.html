<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Battle Simulator - Wasteland Wheels</title>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: Arial, sans-serif;
			background-color: #1a1a1a;
			color: #f0f0f0;
		}
		
		.container {
			max-width: 1200px;
			margin: 0 auto;
		}
		
		h1 {
			text-align: center;
			color: #ff6b6b;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
		}
		
		.battle-setup {
			display: flex;
			gap: 20px;
			margin-bottom: 30px;
			flex-wrap: wrap;
		}
		
		.team-setup {
			flex: 1;
			min-width: 300px;
			background-color: #2a2a2a;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.3);
		}
		
		.team-setup h2 {
			margin-top: 0;
			color: #4dabf7;
		}
		
		.enemy-team h2 {
			color: #ff6b6b;
		}
		
		.form-group {
			margin-bottom: 15px;
		}
		
		label {
			display: block;
			margin-bottom: 5px;
			font-weight: bold;
		}
		
		select {
			width: 100%;
			padding: 8px;
			background-color: #3a3a3a;
			color: #f0f0f0;
			border: 1px solid #555;
			border-radius: 4px;
			font-size: 14px;
		}
		
		button {
			width: 100%;
			padding: 12px 24px;
			font-size: 18px;
			font-weight: bold;
			background-color: #ff6b6b;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			transition: background-color 0.3s;
		}
		
		button:hover {
			background-color: #ff5252;
		}
		
		button:disabled {
			background-color: #666;
			cursor: not-allowed;
		}
		
		.battle-controls {
			text-align: center;
			margin-bottom: 30px;
		}
		
		.battle-controls button {
			width: auto;
			padding: 12px 48px;
		}
		
		.results {
			background-color: #2a2a2a;
			padding: 20px;
			border-radius: 8px;
			margin-bottom: 20px;
			display: none;
		}
		
		.results.show {
			display: block;
		}
		
		.results h2 {
			margin-top: 0;
			color: #69db7c;
		}
		
		.winner {
			font-size: 24px;
			font-weight: bold;
			text-align: center;
			padding: 20px;
			margin-bottom: 20px;
			border-radius: 4px;
		}
		
		.winner.player {
			background-color: #2b8a3e;
		}
		
		.winner.enemy {
			background-color: #c92a2a;
		}
		
		.winner.tie {
			background-color: #868e96;
		}
		
		.battle-stats {
			display: flex;
			gap: 20px;
			margin-bottom: 20px;
		}
		
		.team-stats {
			flex: 1;
			padding: 15px;
			background-color: #1a1a1a;
			border-radius: 4px;
		}
		
		.team-stats h3 {
			margin-top: 0;
		}
		
		.battle-log {
			background-color: #1a1a1a;
			padding: 20px;
			border-radius: 8px;
			max-height: 400px;
			overflow-y: auto;
		}
		
		.battle-log h2 {
			margin-top: 0;
			color: #ffd43b;
		}
		
		.log-entry {
			margin-bottom: 8px;
			padding: 4px 8px;
			border-radius: 4px;
			font-family: monospace;
			font-size: 14px;
		}
		
		.log-entry.damage_dealt {
			background-color: rgba(255, 107, 107, 0.2);
		}
		
		.log-entry.heal_applied {
			background-color: rgba(105, 219, 124, 0.2);
		}
		
		.log-entry.turn_start {
			background-color: rgba(77, 171, 247, 0.2);
			font-weight: bold;
		}
		
		.log-entry.battle_end {
			background-color: rgba(255, 213, 59, 0.2);
			font-weight: bold;
		}
		
		.log-entry.card_played {
			background-color: rgba(148, 114, 252, 0.2);
		}
		
		.log-entry.miss {
			background-color: rgba(134, 142, 150, 0.2);
			font-style: italic;
		}
		
		.loading {
			text-align: center;
			padding: 40px;
			font-size: 20px;
		}
		
		.driver-select {
			margin-bottom: 10px;
		}
		
		.vehicle-group {
			background-color: #1a1a1a;
			padding: 15px;
			margin-bottom: 15px;
			border-radius: 4px;
		}
		
		.vehicle-group h3 {
			margin-top: 0;
			color: #ffd43b;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Wasteland Wheels - AI Battle Simulator</h1>
		
		<div class="battle-setup">
			<div class="team-setup player-team">
				<h2>Player Team</h2>
				<div class="form-group">
					<label for="player-ai">AI Strategy:</label>
					<select id="player-ai">
						<option value="">Human Player (Not Available)</option>
						<option value="random">Random AI</option>
						<option value="aggressive" selected>Aggressive Flanker AI</option>
						<option value="mcts">Monte Carlo Tree Search AI</option>
					</select>
				</div>
				
				<div class="vehicle-group">
					<h3>Vehicle 1</h3>
					<div class="form-group driver-select">
						<label for="player-driver-1">Driver:</label>
						<select id="player-driver-1">
							<option value="road_warrior" selected>Road Warrior</option>
							<option value="interceptor">Interceptor</option>
							<option value="mechanic">Mechanic</option>
							<option value="raider">Raider</option>
						</select>
					</div>
				</div>
				
				<div class="vehicle-group">
					<h3>Vehicle 2</h3>
					<div class="form-group driver-select">
						<label for="player-driver-2">Driver:</label>
						<select id="player-driver-2">
							<option value="road_warrior">Road Warrior</option>
							<option value="interceptor" selected>Interceptor</option>
							<option value="mechanic">Mechanic</option>
							<option value="raider">Raider</option>
						</select>
					</div>
				</div>
			</div>
			
			<div class="team-setup enemy-team">
				<h2>Enemy Team</h2>
				<div class="form-group">
					<label for="enemy-ai">AI Strategy:</label>
					<select id="enemy-ai">
						<option value="">Simple AI (Default)</option>
						<option value="random" selected>Random AI</option>
						<option value="aggressive">Aggressive Flanker AI</option>
						<option value="mcts">Monte Carlo Tree Search AI</option>
					</select>
				</div>
				
				<div class="vehicle-group">
					<h3>Vehicle 1</h3>
					<div class="form-group driver-select">
						<label for="enemy-driver-1">Driver:</label>
						<select id="enemy-driver-1">
							<option value="road_warrior">Road Warrior</option>
							<option value="interceptor">Interceptor</option>
							<option value="mechanic" selected>Mechanic</option>
							<option value="raider">Raider</option>
						</select>
					</div>
				</div>
				
				<div class="vehicle-group">
					<h3>Vehicle 2</h3>
					<div class="form-group driver-select">
						<label for="enemy-driver-2">Driver:</label>
						<select id="enemy-driver-2">
							<option value="road_warrior">Road Warrior</option>
							<option value="interceptor">Interceptor</option>
							<option value="mechanic">Mechanic</option>
							<option value="raider" selected>Raider</option>
						</select>
					</div>
				</div>
			</div>
		</div>
		
		<div class="battle-controls">
			<button id="run-battle" onclick="runBattle()">Run Battle</button>
		</div>
		
		<div id="results" class="results">
			<h2>Battle Results</h2>
			<div id="winner" class="winner"></div>
			
			<div class="battle-stats">
				<div class="team-stats">
					<h3>Player Team</h3>
					<div id="player-stats"></div>
				</div>
				<div class="team-stats">
					<h3>Enemy Team</h3>
					<div id="enemy-stats"></div>
				</div>
			</div>
		</div>
		
		<div class="battle-log">
			<h2>Battle Log</h2>
			<div id="log-container"></div>
		</div>
	</div>
	
	<div id="loading" class="loading" style="display: none;">
		Running battle simulation...
	</div>
	
	<script src="battle-simulator.js"></script>
</body>
</html>
